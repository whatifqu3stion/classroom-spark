# Deployment proposal; importing this Blueprint creates billable resources.
# See docs/RENDER.md before disabling maintenance mode.
# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: boardwork
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    healthCheckPath: /api/readyz
    maintenanceMode:
      enabled: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boardwork-db
          property: connectionString
      - key: PORT
        value: '8080'
      - key: STATIC_DIR
        value: /app/public
      - key: PDF_STORAGE_DIR
        value: /data/pdfs
      - key: BYOK_MODEL
        value: gpt-5-mini
      - key: DEPLOYMENT_ACCESS_PROTECTED
        value: 'false'
    disk:
      name: boardwork-pdfs
      mountPath: /data
      sizeGB: 1

databases:
  - name: boardwork-db
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: '16'
    databaseName: boardwork
    user: boardwork
    diskSizeGB: 1
    ipAllowList: []
