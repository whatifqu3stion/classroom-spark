# Temporary shared preview. Render supplies the database URL and initial password.
services:
  - type: web
    name: boardwork-preview
    runtime: docker
    plan: free
    region: oregon
    autoDeployTrigger: 'off'
    healthCheckPath: /api/readyz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boardwork-preview-db
          property: connectionString
      - key: BOARDWORK_PREVIEW_PASSWORD
        generateValue: true
      - key: DEPLOYMENT_ACCESS_PROTECTED
        value: 'false'

databases:
  - name: boardwork-preview-db
    plan: free
    region: oregon
    postgresMajorVersion: '16'
    ipAllowList: []
