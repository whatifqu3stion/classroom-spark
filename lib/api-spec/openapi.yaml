openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: app-state
    description: Application bootstrap and selection
  - name: classes
    description: Class profile operations
  - name: instructional-context
    description: Per-class instructional context operations
  - name: units
    description: Reusable teacher unit operations
  - name: chips
    description: Class chip operations
  - name: saved-context
    description: Reusable saved context and category operations
  - name: activities
    description: Activity/history operations
  - name: generation
    description: Server-side Boardwork activity generation
paths:
  /classes/{classId}/curriculum:
    parameters:
      - {name: classId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listCurriculumSources
      responses:
        "200":
          description: Sources and readiness
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurriculumSourceList"}
    post:
      operationId: createCurriculumSource
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CurriculumSourceInput"}
      responses:
        "201":
          description: Draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurriculumSource"}
  /classes/{classId}/curriculum/discover:
    parameters:
      - {name: classId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: discoverCurriculumReferences
      responses:
        "200":
          description: Retrieved candidates; not approved curriculum
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CurriculumReference"}
  /classes/{classId}/curriculum/pdf:
    parameters:
      - {name: classId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: title, in: query, required: true, schema: {type: string, maxLength: 200}}
      - {name: unitId, in: query, schema: {type: string, format: uuid}}
    post:
      operationId: uploadCurriculumPdf
      requestBody:
        required: true
        content:
          application/pdf:
            schema: {$ref: "#/components/schemas/CurriculumPdf"}
      responses:
        "201":
          description: Extracted draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurriculumSource"}
  /classes/{classId}/curriculum/{sourceId}:
    parameters:
      - {name: classId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: sourceId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getCurriculumSource
      responses:
        "200":
          description: Source
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurriculumSource"}
    patch:
      operationId: updateCurriculumSource
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CurriculumSourceUpdate"}
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurriculumSource"}
    delete:
      operationId: deleteCurriculumSource
      responses:
        "204":
          description: Deleted; historical board snapshots retained
  /classes/{classId}/curriculum/{sourceId}/refresh:
    parameters:
      - {name: classId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: sourceId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: refreshCurriculumSource
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CurriculumVersionInput"}
      responses:
        "200":
          description: New draft requiring review
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurriculumSource"}
  /classes/{classId}/curriculum/{sourceId}/file:
    parameters:
      - {name: classId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: sourceId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getCurriculumPdf
      responses:
        "200":
          description: Protected original PDF
          content:
            application/pdf:
              schema: {$ref: "#/components/schemas/CurriculumPdf"}
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /app-state:
    get:
      operationId: getAppState
      tags: [app-state]
      summary: Bootstrap application state
      description: Returns all classes, instructional contexts, chips, activities, and the most recently used class id so the frontend can restore workspace state.
      responses:
        "200":
          description: Application state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppState"

  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: List classes
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassProfile"
    post:
      operationId: createClass
      tags: [classes]
      summary: Create a class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassProfile"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /classes/{classId}:
    patch:
      operationId: updateClass
      tags: [classes]
      summary: Update a class
      parameters:
        - $ref: "#/components/parameters/ClassIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassProfile"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteClass
      tags: [classes]
      summary: Delete a class
      description: Atomically deletes the class and cascades instructional context, chips, and activities. If the deleted class was most recently used, selection is cleared/reassigned in a transaction.
      parameters:
        - $ref: "#/components/parameters/ClassIdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /classes/{classId}/select:
    post:
      operationId: selectClass
      tags: [classes]
      summary: Mark a class as most recently used
      description: Records the class as the most recently used (active) class.
      parameters:
        - $ref: "#/components/parameters/ClassIdParam"
      responses:
        "200":
          description: Selection applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveSelection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /classes/{classId}/instructional-context:
    get:
      operationId: getInstructionalContext
      tags: [instructional-context]
      summary: Get instructional context for a class
      parameters:
        - $ref: "#/components/parameters/ClassIdParam"
      responses:
        "200":
          description: Instructional context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructionalContext"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      operationId: updateInstructionalContext
      tags: [instructional-context]
      summary: Update instructional context for a class
      description: Upserts the per-class instructional context.
      parameters:
        - $ref: "#/components/parameters/ClassIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructionalContextInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructionalContext"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /units:
    get:
      operationId: listUnits
      tags: [units]
      summary: List reusable units
      responses:
        "200":
          description: Reusable units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"
    post:
      operationId: createUnit
      tags: [units]
      summary: Create a reusable unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /units/{unitId}:
    patch:
      operationId: updateUnit
      tags: [units]
      summary: Update a reusable unit
      parameters:
        - $ref: "#/components/parameters/UnitIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteUnit
      tags: [units]
      summary: Remove a reusable unit
      parameters:
        - $ref: "#/components/parameters/UnitIdParam"
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /generate:
    post:
      operationId: generateActivity
      tags: [generation]
      summary: Generate and save a Boardwork activity
      description: Builds canonical generation context server-side, generates one validated activity, saves it, and returns the persisted activity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateActivityInput"
      responses:
        "201":
          description: Generated and saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Class or Focus chip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Generation already in progress for this class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: AI provider rate limited the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: AI provider or structured output failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: AI generation is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: AI provider timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /classes/{classId}/chips:
    post:
      operationId: createChip
      tags: [chips]
      summary: Create a chip for a class
      parameters:
        - $ref: "#/components/parameters/ClassIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChipInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chip"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chips/{chipId}:
    patch:
      operationId: updateChip
      tags: [chips]
      summary: Update a chip
      parameters:
        - $ref: "#/components/parameters/ChipIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChipUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chip"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteChip
      tags: [chips]
      summary: Delete a chip
      parameters:
        - $ref: "#/components/parameters/ChipIdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /saved-context:
    get:
      operationId: listSavedContexts
      tags: [saved-context]
      summary: List available saved context
      description: Returns active saved context visible to a class (class-scoped records for the requested class plus global records) and all active categories.
      parameters:
        - $ref: "#/components/parameters/ClassIdQueryParam"
      responses:
        "200":
          description: Saved context library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedContextLibrary"
        "400":
          description: Invalid class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Class not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createSavedContext
      tags: [saved-context]
      summary: Create saved context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedContextInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedContext"
        "400":
          description: Invalid request or scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /saved-context/{contextId}:
    patch:
      operationId: updateSavedContext
      tags: [saved-context]
      summary: Fully edit saved context
      description: Replaces all editable fields. Archived records cannot be edited.
      parameters:
        - $ref: "#/components/parameters/SavedContextIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedContextUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedContext"
        "400":
          description: Invalid request or scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /saved-context/{contextId}/archive:
    post:
      operationId: archiveSavedContext
      tags: [saved-context]
      summary: Archive saved context
      description: Archives a saved context without removing historical activity snapshots.
      parameters:
        - $ref: "#/components/parameters/SavedContextIdParam"
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedContext"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /context-categories:
    post:
      operationId: createContextCategory
      tags: [saved-context]
      summary: Create a saved context category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextCategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextCategory"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: List activities
      description: Lists activities, optionally filtered by class.
      parameters:
        - name: classId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
    post:
      operationId: createActivity
      tags: [activities]
      summary: Create an activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /activities/{activityId}:
    get:
      operationId: getActivity
      tags: [activities]
      summary: Get an activity
      parameters:
        - $ref: "#/components/parameters/ActivityIdParam"
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateActivity
      tags: [activities]
      summary: Update an activity
      description: Updates activity fields, including toggling favorite.
      parameters:
        - $ref: "#/components/parameters/ActivityIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteActivity
      tags: [activities]
      summary: Delete an activity
      parameters:
        - $ref: "#/components/parameters/ActivityIdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /activities/non-favorites:
    delete:
      operationId: clearNonFavoriteActivities
      tags: [activities]
      summary: Delete all non-favorited activities
      description: Permanently removes every activity whose favorite flag is false. Favorited activities are preserved.
      responses:
        "200":
          description: Cleanup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteActivitiesResult"

  /activities/{activityId}/duplicate:
    post:
      operationId: duplicateActivity
      tags: [activities]
      summary: Duplicate an activity
      description: Copies an activity as a new editable record without mutating the original. Sets duplicatedFrom to the source activity id and clears favorite.
      parameters:
        - $ref: "#/components/parameters/ActivityIdParam"
      responses:
        "201":
          description: Created copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /activities/{activityId}/favorite:
    patch:
      operationId: setActivityFavorite
      tags: [activities]
      summary: Set an activity's favorite flag
      parameters:
        - $ref: "#/components/parameters/ActivityIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    ClassIdParam:
      name: classId
      in: path
      required: true
      schema:
        type: string
    ChipIdParam:
      name: chipId
      in: path
      required: true
      schema:
        type: string
    ActivityIdParam:
      name: activityId
      in: path
      required: true
      schema:
        type: string
    UnitIdParam:
      name: unitId
      in: path
      required: true
      schema:
        type: string
    SavedContextIdParam:
      name: contextId
      in: path
      required: true
      schema:
        type: string
    ClassIdQueryParam:
      name: classId
      in: query
      required: true
      schema:
        type: string
  schemas:
    CurriculumPdf:
      type: string
      format: binary
    CurriculumObjective:
      type: object
      required: [id, label, excerpt, locator, selected]
      properties:
        id: {type: string, maxLength: 100}
        label: {type: string, minLength: 1, maxLength: 500}
        excerpt: {type: string, maxLength: 2000}
        locator: {type: string, maxLength: 200}
        selected: {type: boolean}
    CurriculumReference:
      type: object
      required: [title, url, publisher]
      properties:
        title: {type: string}
        url: {type: string}
        publisher: {type: string}
    CurriculumSource:
      type: object
      required: [id, classId, unitId, kind, status, version, title, summary, subject, framework, programmeYear, objectives, publisher, url, edition, retrievedAt, approvedAt, createdAt, updatedAt]
      properties:
        id: {type: string}
        classId: {type: string}
        unitId: {type: [string, "null"]}
        kind: {type: string, enum: [manual, pdf, web]}
        status: {type: string, enum: [draft, approved, inactive, delete_failed]}
        version: {type: integer}
        title: {type: string}
        summary: {type: string}
        subject: {type: string}
        framework: {type: [string, "null"]}
        programmeYear: {type: [string, "null"]}
        objectives:
          type: array
          items: {$ref: "#/components/schemas/CurriculumObjective"}
        publisher: {type: [string, "null"]}
        url: {type: [string, "null"]}
        edition: {type: [string, "null"]}
        retrievedAt: {type: [string, "null"]}
        approvedAt: {type: [string, "null"]}
        createdAt: {type: string}
        updatedAt: {type: string}
    CurriculumSourceList:
      type: object
      required: [ready, reason, items]
      properties:
        ready: {type: boolean}
        reason: {type: [string, "null"]}
        capabilities:
          $ref: "#/components/schemas/CurriculumCapabilities"
        items:
          type: array
          items: {$ref: "#/components/schemas/CurriculumSource"}
    CurriculumCapabilities:
      type: object
      required: [accessConfigured, aiConfigured, storageConfigured, pdfUpload, discovery, discoveryFrameworks, message]
      properties:
        accessConfigured: {type: boolean}
        aiConfigured: {type: boolean}
        storageConfigured: {type: boolean}
        pdfUpload: {type: boolean}
        discovery: {type: boolean}
        discoveryFrameworks:
          type: array
