name: Security origin checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: 5173
      BASE_PATH: /
      VITE_PUBLIC_SITE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: node --experimental-strip-types --test artifacts/api-server/tests/origin-policy.test.mjs
      - run: npm install --global pnpm@11.25.0 --ignore-scripts --audit=false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server run test
      - run: pnpm --filter @workspace/boardwork run build
